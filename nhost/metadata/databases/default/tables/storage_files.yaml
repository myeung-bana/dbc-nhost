table:
  name: files
  schema: storage
insert_permissions:
  - role: user
    permission:
      check:
        bucket_id:
          _in: [default, avatars]
      set:
        uploaded_by_user_id: x-hasura-User-Id
      columns:
        - id
        - bucket_id
        - name
        - mime_type
        - size
  - role: member
    permission:
      check:
        bucket_id:
          _in: [default, avatars]
      set:
        uploaded_by_user_id: x-hasura-User-Id
      columns:
        - id
        - bucket_id
        - name
        - mime_type
        - size
  - role: casual
    permission:
      check:
        bucket_id:
          _in: [default, avatars]
      set:
        uploaded_by_user_id: x-hasura-User-Id
      columns:
        - id
        - bucket_id
        - name
        - mime_type
        - size
select_permissions:
  - role: user
    permission:
      columns:
        - id
        - bucket_id
        - name
        - mime_type
        - size
        - uploaded_by_user_id
      filter:
        uploaded_by_user_id:
          _eq: X-Hasura-User-Id
  - role: member
    permission:
      columns:
        - id
        - bucket_id
        - name
        - mime_type
        - size
        - uploaded_by_user_id
      filter:
        uploaded_by_user_id:
          _eq: X-Hasura-User-Id
  - role: casual
    permission:
      columns:
        - id
        - bucket_id
        - name
        - mime_type
        - size
        - uploaded_by_user_id
      filter:
        uploaded_by_user_id:
          _eq: X-Hasura-User-Id
  - role: public
    permission:
      columns:
        - id
        - bucket_id
        - name
      filter:
        bucket_id:
          _eq: avatars
update_permissions:
  - role: user
    permission:
      columns:
        - name
        - mime_type
        - size
        - metadata
      filter:
        uploaded_by_user_id:
          _eq: X-Hasura-User-Id
      check:
        uploaded_by_user_id:
          _eq: X-Hasura-User-Id
  - role: member
    permission:
      columns:
        - name
        - mime_type
        - size
        - metadata
      filter:
        uploaded_by_user_id:
          _eq: X-Hasura-User-Id
      check:
        uploaded_by_user_id:
          _eq: X-Hasura-User-Id
  - role: casual
    permission:
      columns:
        - name
        - mime_type
        - size
        - metadata
      filter:
        uploaded_by_user_id:
          _eq: X-Hasura-User-Id
      check:
        uploaded_by_user_id:
          _eq: X-Hasura-User-Id
delete_permissions:
  - role: user
    permission:
      filter:
        uploaded_by_user_id:
          _eq: X-Hasura-User-Id
  - role: member
    permission:
      filter:
        uploaded_by_user_id:
          _eq: X-Hasura-User-Id
  - role: casual
    permission:
      filter:
        uploaded_by_user_id:
          _eq: X-Hasura-User-Id
