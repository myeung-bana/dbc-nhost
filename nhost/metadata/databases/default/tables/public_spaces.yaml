table:
  name: spaces
  schema: public
array_relationships:
  - name: space_memberships
    using:
      foreign_key_constraint_on:
        column: space_id
        table:
          name: space_memberships
          schema: public
  - name: sessions
    using:
      foreign_key_constraint_on:
        column: space_id
        table:
          name: sessions
          schema: public
  - name: activity_logs
    using:
      foreign_key_constraint_on:
        column: space_id
        table:
          name: activity_log
          schema: public
  - name: space_follows
    using:
      foreign_key_constraint_on:
        column: space_id
        table:
          name: space_follows
          schema: public
  - name: space_activities
    using:
      foreign_key_constraint_on:
        column: space_id
        table:
          name: space_activities
          schema: public
select_permissions:
  - role: super_admin
    permission:
      columns: "*"
      filter: {}
      allow_aggregations: true
  - role: organiser
    permission:
      columns: "*"
      filter:
        space_memberships:
          user_id:
            _eq: X-Hasura-User-Id
          role:
            _eq: organiser
          status:
            _eq: active
  - role: member
    permission:
      columns:
        - id
        - name
        - slug
        - description
        - status
        - visibility
        - logo_url
        - pass_redemption_mode
        - auto_consume_cutoff_minutes
        - created_at
      filter:
        _or:
          - visibility:
              _eq: public
          - space_memberships:
              user_id:
                _eq: X-Hasura-User-Id
              status:
                _eq: active
          - space_follows:
              user_id:
                _eq: X-Hasura-User-Id
  - role: casual
    permission:
      columns:
        - id
        - name
        - slug
        - description
        - status
        - visibility
        - logo_url
        - pass_redemption_mode
        - auto_consume_cutoff_minutes
        - created_at
      filter:
        _or:
          - visibility:
              _eq: public
          - space_memberships:
              user_id:
                _eq: X-Hasura-User-Id
              status:
                _eq: active
          - space_follows:
              user_id:
                _eq: X-Hasura-User-Id
  - role: user
    permission:
      columns:
        - id
        - name
        - slug
        - description
        - status
        - visibility
        - logo_url
      filter:
        _and:
          - visibility:
              _eq: public
          - status:
              _eq: active
  - role: public
    permission:
      columns:
        - id
        - name
        - slug
        - description
        - status
        - visibility
        - logo_url
      filter:
        _and:
          - visibility:
              _eq: public
          - status:
              _eq: active
insert_permissions:
  - role: super_admin
    permission:
      check: {}
      columns:
        - name
        - slug
        - description
        - status
        - visibility
update_permissions:
  - role: super_admin
    permission:
      columns:
        - name
        - slug
        - description
        - status
        - visibility
        - logo_url
        - pass_redemption_mode
        - auto_consume_cutoff_minutes
      filter: {}
      check: null
  - role: organiser
    permission:
      columns:
        - name
        - slug
        - description
        - visibility
        - logo_url
        - pass_redemption_mode
        - auto_consume_cutoff_minutes
      filter:
        space_memberships:
          user_id:
            _eq: X-Hasura-User-Id
          role:
            _eq: organiser
          status:
            _eq: active
      check: null
delete_permissions:
  - role: super_admin
    permission:
      filter: {}
