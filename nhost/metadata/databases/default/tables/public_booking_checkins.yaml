table:
  name: booking_checkins
  schema: public
object_relationships:
  - name: booking
    using:
      foreign_key_constraint_on: booking_id
  - name: session
    using:
      foreign_key_constraint_on: session_id
  - name: user
    using:
      foreign_key_constraint_on: user_id
  - name: user_season_pass
    using:
      foreign_key_constraint_on: user_season_pass_id
  - name: scanner
    using:
      foreign_key_constraint_on: scanned_by
select_permissions:
  - role: super_admin
    permission:
      columns: "*"
      filter: {}
      allow_aggregations: true
  - role: organiser
    permission:
      columns: "*"
      filter:
        session:
          space:
            space_memberships:
              user_id:
                _eq: X-Hasura-User-Id
              role:
                _eq: organiser
              status:
                _eq: active
      allow_aggregations: true
  - role: member
    permission:
      columns:
        - id
        - booking_id
        - session_id
        - user_id
        - user_season_pass_id
        - method
        - scanned_at
        - credit_delta
      filter:
        user_id:
          _eq: X-Hasura-User-Id
  - role: casual
    permission:
      columns:
        - id
        - booking_id
        - session_id
        - user_id
        - user_season_pass_id
        - method
        - scanned_at
        - credit_delta
      filter:
        user_id:
          _eq: X-Hasura-User-Id
  - role: user
    permission:
      columns:
        - id
        - booking_id
        - session_id
        - user_id
        - method
        - scanned_at
      filter:
        user_id:
          _eq: X-Hasura-User-Id
insert_permissions:
  - role: super_admin
    permission:
      check: {}
      columns:
        - booking_id
        - session_id
        - user_id
        - user_season_pass_id
        - method
        - scanned_by
        - credit_delta
