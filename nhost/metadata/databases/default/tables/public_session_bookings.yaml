table:
  name: session_bookings
  schema: public
object_relationships:
  - name: session
    using:
      foreign_key_constraint_on: session_id
  - name: user
    using:
      foreign_key_constraint_on: user_id
select_permissions:
  - role: super_admin
    permission:
      columns: "*"
      filter: {}
      allow_aggregations: true
  - role: organiser
    permission:
      columns: "*"
      filter:
        session:
          space:
            space_memberships:
              user_id:
                _eq: X-Hasura-User-Id
              role:
                _eq: organiser
              status:
                _eq: active
  - role: member
    permission:
      columns:
        - id
        - session_id
        - user_id
        - status
        - created_at
        - updated_at
      filter:
        _or:
          - user_id:
              _eq: X-Hasura-User-Id
          - _and:
              - status:
                  _eq: confirmed
              - session:
                  session_bookings:
                    user_id:
                      _eq: X-Hasura-User-Id
                    status:
                      _eq: confirmed
      allow_aggregations: true
  - role: casual
    permission:
      columns:
        - id
        - session_id
        - user_id
        - status
        - created_at
        - updated_at
      filter:
        _or:
          - user_id:
              _eq: X-Hasura-User-Id
          - _and:
              - status:
                  _eq: confirmed
              - session:
                  session_bookings:
                    user_id:
                      _eq: X-Hasura-User-Id
                    status:
                      _eq: confirmed
      allow_aggregations: true
  - role: user
    permission:
      columns:
        - id
        - status
      filter:
        _and:
          - status:
              _eq: confirmed
          - session:
              space:
                _and:
                  - visibility:
                      _eq: public
                  - status:
                      _eq: active
      allow_aggregations: true
  - role: public
    permission:
      columns:
        - id
        - status
      filter:
        _and:
          - status:
              _eq: confirmed
          - session:
              space:
                _and:
                  - visibility:
                      _eq: public
                  - status:
                      _eq: active
      allow_aggregations: true
