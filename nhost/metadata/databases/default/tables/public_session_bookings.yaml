table:
  name: session_bookings
  schema: public
object_relationships:
  - name: session
    using:
      foreign_key_constraint_on: session_id
  - name: user
    using:
      foreign_key_constraint_on: user_id
select_permissions:
  - role: super_admin
    permission:
      columns: "*"
      filter: {}
      allow_aggregations: true
  - role: organiser
    permission:
      columns: "*"
      filter:
        session:
          space:
            space_memberships:
              user_id:
                _eq: X-Hasura-User-Id
              role:
                _eq: organiser
              status:
                _eq: active
