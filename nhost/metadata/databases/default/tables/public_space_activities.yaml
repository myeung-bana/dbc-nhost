table:
  name: space_activities
  schema: public
object_relationships:
  - name: space
    using:
      foreign_key_constraint_on: space_id
  - name: activity
    using:
      foreign_key_constraint_on: activity_id
select_permissions:
  - role: super_admin
    permission:
      columns: "*"
      filter: {}
      allow_aggregations: true
  - role: organiser
    permission:
      columns: "*"
      filter:
        space:
          space_memberships:
            user_id:
              _eq: X-Hasura-User-Id
            role:
              _eq: organiser
            status:
              _eq: active
  - role: member
    permission:
      columns: "*"
      filter:
        space:
          _or:
            - visibility:
                _eq: public
            - space_memberships:
                user_id:
                  _eq: X-Hasura-User-Id
                status:
                  _eq: active
            - space_follows:
                user_id:
                  _eq: X-Hasura-User-Id
  - role: casual
    permission:
      columns: "*"
      filter:
        space:
          _or:
            - visibility:
                _eq: public
            - space_memberships:
                user_id:
                  _eq: X-Hasura-User-Id
                status:
                  _eq: active
            - space_follows:
                user_id:
                  _eq: X-Hasura-User-Id
  - role: user
    permission:
      columns: "*"
      filter:
        space:
          _and:
            - visibility:
                _eq: public
            - status:
                _eq: active
  - role: public
    permission:
      columns: "*"
      filter:
        space:
          _and:
            - visibility:
                _eq: public
            - status:
                _eq: active
insert_permissions:
  - role: super_admin
    permission:
      check: {}
      columns:
        - space_id
        - activity_id
delete_permissions:
  - role: super_admin
    permission:
      filter: {}
