table:
  name: space_follows
  schema: public
object_relationships:
  - name: space
    using:
      foreign_key_constraint_on: space_id
  - name: user
    using:
      foreign_key_constraint_on: user_id
select_permissions:
  - role: super_admin
    permission:
      columns: "*"
      filter: {}
      allow_aggregations: true
  - role: organiser
    permission:
      columns: "*"
      filter:
        space:
          space_memberships:
            user_id:
              _eq: X-Hasura-User-Id
            role:
              _eq: organiser
            status:
              _eq: active
      allow_aggregations: true
  - role: member
    permission:
      columns:
        - id
        - space_id
        - user_id
        - created_at
      filter:
        user_id:
          _eq: X-Hasura-User-Id
  - role: casual
    permission:
      columns:
        - id
        - space_id
        - user_id
        - created_at
      filter:
        user_id:
          _eq: X-Hasura-User-Id
  - role: user
    permission:
      columns:
        - id
        - space_id
        - user_id
        - created_at
      filter:
        user_id:
          _eq: X-Hasura-User-Id
insert_permissions:
  - role: super_admin
    permission:
      check: {}
      columns:
        - space_id
        - user_id
delete_permissions:
  - role: super_admin
    permission:
      filter: {}
