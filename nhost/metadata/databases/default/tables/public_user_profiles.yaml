table:
  name: user_profiles
  schema: public
object_relationships:
  - name: user
    using:
      foreign_key_constraint_on: user_id
select_permissions:
  - role: member
    permission:
      columns:
        - user_id
        - onboarding_completed
        - onboarding_completed_at
        - created_at
        - updated_at
      filter:
        user_id:
          _eq: X-Hasura-User-Id
  - role: casual
    permission:
      columns:
        - user_id
        - onboarding_completed
        - onboarding_completed_at
        - created_at
        - updated_at
      filter:
        user_id:
          _eq: X-Hasura-User-Id
  - role: user
    permission:
      columns:
        - user_id
        - onboarding_completed
        - onboarding_completed_at
        - created_at
        - updated_at
      filter:
        user_id:
          _eq: X-Hasura-User-Id
insert_permissions:
  - role: member
    permission:
      check:
        user_id:
          _eq: X-Hasura-User-Id
      columns:
        - user_id
        - onboarding_completed
        - onboarding_completed_at
  - role: casual
    permission:
      check:
        user_id:
          _eq: X-Hasura-User-Id
      columns:
        - user_id
        - onboarding_completed
        - onboarding_completed_at
  - role: user
    permission:
      check:
        user_id:
          _eq: X-Hasura-User-Id
      columns:
        - user_id
        - onboarding_completed
        - onboarding_completed_at
update_permissions:
  - role: member
    permission:
      columns:
        - onboarding_completed
        - onboarding_completed_at
      filter:
        user_id:
          _eq: X-Hasura-User-Id
      check:
        user_id:
          _eq: X-Hasura-User-Id
  - role: casual
    permission:
      columns:
        - onboarding_completed
        - onboarding_completed_at
      filter:
        user_id:
          _eq: X-Hasura-User-Id
      check:
        user_id:
          _eq: X-Hasura-User-Id
  - role: user
    permission:
      columns:
        - onboarding_completed
        - onboarding_completed_at
      filter:
        user_id:
          _eq: X-Hasura-User-Id
      check:
        user_id:
          _eq: X-Hasura-User-Id
