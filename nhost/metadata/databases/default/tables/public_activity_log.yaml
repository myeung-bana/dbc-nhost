table:
  name: activity_log
  schema: public
object_relationships:
  - name: space
    using:
      foreign_key_constraint_on: space_id
  - name: actor
    using:
      foreign_key_constraint_on: actor_id
select_permissions:
  - role: super_admin
    permission:
      columns: "*"
      filter: {}
      allow_aggregations: true
  - role: organiser
    permission:
      columns: "*"
      filter:
        space:
          space_memberships:
            user_id:
              _eq: X-Hasura-User-Id
            role:
              _eq: organiser
            status:
              _eq: active
insert_permissions:
  - role: super_admin
    permission:
      check: {}
      columns:
        - space_id
        - actor_id
        - action
        - entity_type
        - entity_id
        - metadata
